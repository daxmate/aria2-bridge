name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build AriaNg from submodule
        run: |
          cd submodules/AriaNg
          npm install
          npm run build
          cd ../..
          rm -rf plugin/aria-ng
          cp -r submodules/AriaNg/dist plugin/aria-ng
          cp scripts/aria-ng-fix.js plugin/aria-ng/js/aria-ng-fix.js
          # Inject fix script into index.html
          MAIN_JS=$(ls plugin/aria-ng/js/aria-ng-*.min.js 2>/dev/null | head -1)
          if [ -n "$MAIN_JS" ]; then
            MAIN_FILE=$(basename "$MAIN_JS")
            sed -i "s|$MAIN_FILE\"></script>|&<script src=\"js/aria-ng-fix.js\"></script>|" plugin/aria-ng/index.html
          fi

      - name: Package extension zip
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DIR="aria2-bridge-$VERSION"
          mkdir -p "dist/$DIR"
          cp -r plugin/* "dist/$DIR/"
          cp README.md LICENSE "dist/$DIR/"
          cd dist
          zip -r "$DIR.zip" "$DIR" > /dev/null
          ls -lh "$DIR.zip"

      - name: Generate Release Notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          {
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              # 按类型归类 commit
              echo "### 🚀 新功能"
              git log "$PREV_TAG..$TAG" --oneline --no-decorate | grep -i 'feat:\|add:\|new' | sed 's/^[a-f0-9]* /- /' || echo "  （无）"
              echo ""
              echo "### 🐛 修复"
              git log "$PREV_TAG..$TAG" --oneline --no-decorate | grep -i 'fix:\|修复\|bug' | sed 's/^[a-f0-9]* /- /' || echo "  （无）"
              echo ""
              echo "### 🔧 其他"
              git log "$PREV_TAG..$TAG" --oneline --no-decorate | grep -vi 'feat:\|add:\|new\|fix:\|修复\|bug' | sed 's/^[a-f0-9]* /- /' || echo "  （无）"
            else
              echo "首次发布"
            fi
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aria2 Bridge ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: dist/aria2-bridge-*.zip
